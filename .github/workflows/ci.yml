name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Validates gradle-wrapper.jar checksums and caches dependencies.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, assemble
        id: gradle
        run: |
          set -o pipefail
          ./gradlew --stacktrace --continue \
            :core:model:jvmTest \
            :core:database:jvmTest \
            :core:domain:jvmTest \
            :core:testing:jvmTest \
            :ui:jvmTest \
            :androidApp:assembleDebug \
            :desktopApp:jvmJar \
            2>&1 | tee build-log.txt

      # The owner's release scripts end to end with a throwaway key: create-keystore.sh →
      # build-release.sh → signed, verified APK (docs/RELEASE.md). The Windows job runs the same.
      - name: Local release scripts with a throwaway key
        run: |
          set -o pipefail
          bash tools/ci/local-release-e2e.sh linux 2>&1 | tee -a build-log.txt

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build-log.txt
            androidApp/build/outputs/apk/**/*.apk
            desktopApp/build/libs/*.jar
            **/build/reports/tests/**
            **/build/reports/runtime-evidence/**
            **/build/test-results/**/*.xml
            core/database/schemas/**
            dist/**

  windows-release:
    name: Local release scripts on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Git Bash on Windows, as on the owner's computer: key creation and a signed release build.
      - name: Create a key and build a signed APK with the owner scripts
        run: |
          if bash tools/ci/local-release-e2e.sh windows > windows-release-log.txt 2>&1; then
            echo 0 > windows-release-result.txt
          else
            echo 1 > windows-release-result.txt
          fi
          tail -n 60 windows-release-log.txt

      - name: Upload Windows outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            windows-release-log.txt
            windows-release-result.txt
            androidApp/build/reports/runtime-evidence/**
            dist/build-*.log

      - name: Fail if the Windows run failed
        run: test "$(cat windows-release-result.txt 2>/dev/null || echo 1)" = "0"

  web:
    name: Web in browsers (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the web distribution
        run: |
          if ./gradlew --stacktrace :webApp:wasmJsBrowserDistribution > web-log.txt 2>&1; then
            echo "built" >> web-log.txt
          else
            echo 1 > web-result.txt
          fi
          tail -n 40 web-log.txt
          ls -la webApp/build/dist/wasmJs/productionExecutable 2>&1 | tee -a web-log.txt || true

      # Plain static server without COOP/COEP headers (ADR-004); Chromium and Firefox are required.
      - name: Browser tests
        if: hashFiles('web-result.txt') == ''
        working-directory: webApp/e2e
        env:
          # Firefox runs headed on a virtual display: headless Firefox has no WebGL here (ADR-004).
          FIREFOX_HEADED: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit > ../../playwright-install.txt 2>&1
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 >> ../../playwright-install.txt 2>&1
          xvfb-run -a --server-args="-screen 0 1280x800x24" npx playwright test 2>&1 | tee -a ../../web-log.txt || true
          node summarize.mjs | tee -a ../../web-log.txt

      - name: Upload web outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            web-log.txt
            web-result.txt
            webApp/build/reports/runtime-evidence/**
            webApp/build/test-results/**
            webApp/build/dist/wasmJs/productionExecutable/**
            webApp/e2e/test-results/**
            kotlin-js-store/**

      - name: Fail if the web check failed
        run: test "$(cat web-result.txt 2>/dev/null || echo 1)" = "0"

  android-device:
    name: Android emulator API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            image-api: "26"
            target: default
          # Since Android 17 the SDK names system images with a minor level: android-37.0.
          # ATD ("automated test device") images are headless test images built for CI;
          # the full google_apis API 37 image did not reach boot_completed on hosted runners.
          - api: 37
            image-api: "37.0"
            target: google_atd
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Recorded in the device log so the PR report shows which images exist when the emulator fails.
      - name: List system images
        run: |
          {
            echo "== system images for API ${{ matrix.api }} (sdkmanager --list) =="
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
              | grep -E "system-images;android-${{ matrix.api }}[;.-]" | sed 's/ *|.*//' | sort -u || true
          } | tee device-${{ matrix.api }}-log.txt

      # Compile before the emulator boots so emulator minutes are spent on tests only.
      - name: Assemble app and test APKs
        run: ./gradlew --stacktrace :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest

      # Own script instead of a packaged emulator action: every install/boot step lands in the
      # device log, which the PR report shows when a run fails.
      - name: Run instrumented tests on the emulator
        run: >-
          bash tools/ci/run-emulator.sh device-${{ matrix.api }} ${{ matrix.image-api }} ${{ matrix.target }}
          bash tools/ci/device-tests.sh ${{ matrix.api }}

      - name: Upload device outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-${{ matrix.api }}-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            device-${{ matrix.api }}-log.txt
            device-${{ matrix.api }}-result.txt
            device-${{ matrix.api }}-emulator.txt
            androidApp/build/outputs/androidTest-results/**
            androidApp/build/reports/androidTests/**
            androidApp/build/reports/runtime-evidence/**

      - name: Fail if instrumented tests failed
        run: test "$(cat device-${{ matrix.api }}-result.txt 2>/dev/null || echo 1)" = "0"

  upgrade:
    name: Upgrade over previous version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build previous (PR base) and current APKs
        run: |
          set -o pipefail
          bash tools/ci/build-upgrade-pair.sh "${{ github.event.pull_request.base.sha }}" 2>&1 | tee upgrade-log.txt

      - name: Install previous, upgrade in place, compare data
        run: >-
          bash tools/ci/run-emulator.sh upgrade 37.0 google_atd
          bash tools/ci/upgrade-test.sh

      - name: Upload upgrade outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            upgrade-log.txt
            upgrade-result.txt
            upgrade-emulator.txt
            upgrade/before/**
            upgrade/after/**
            androidApp/build/reports/runtime-evidence/upgrade.txt

      - name: Fail if the upgrade check failed
        run: test "$(cat upgrade-result.txt 2>/dev/null || echo 1)" = "0"

  # GitHub Actions logs are not reachable from every reviewer environment, so all evidence is
  # mirrored into one PR comment that is updated on every run.
  report:
    name: PR report
    needs: [build, windows-release, web, android-device, upgrade]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Compose report
        run: |
          verdict() { # $1 = result file, $2 = job result when the file is missing
            if [ -f "$1" ]; then
              if [ "$(cat "$1")" = "0" ]; then echo success; else echo failure; fi
            else
              echo "$2 (no result file)"
            fi
          }
          python3 tools/ci/report.py \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --job "Build and JVM tests=${{ needs.build.result }}=build-log.txt" \
            --job "Local release scripts on Windows=$(verdict windows-release-result.txt ${{ needs.windows-release.result }})=windows-release-log.txt" \
            --job "Web in browsers=$(verdict web-result.txt ${{ needs.web.result }})=web-log.txt" \
            --job "Android emulator API 26=$(verdict device-26-result.txt ${{ needs.android-device.result }})=device-26-log.txt" \
            --job "Android emulator API 37=$(verdict device-37-result.txt ${{ needs.android-device.result }})=device-37-log.txt" \
            --job "Upgrade over previous version=$(verdict upgrade-result.txt ${{ needs.upgrade.result }})=upgrade-log.txt" \
            > ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post report to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '[.[] | select(.body | startswith("<!-- ci-report -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@ci-report.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@ci-report.md >/dev/null
          fi
